<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="面向企业真实落地的 AI 应用工程师 20 周学习平台" />
    <meta name="theme-color" content="#0b0d12" />
    <title>AI Path · 企业 AI 应用工程师成长路径</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <div>
            <strong>AI Path</strong>
            <small>生产落地学习平台</small>
          </div>
        </div>

        <nav class="primary-nav">
          <button class="nav-item active" type="button" data-route="dashboard">
            <span class="nav-icon">⌂</span><span>学习总览</span>
          </button>
          <button class="nav-item" type="button" data-route="resources">
            <span class="nav-icon">书</span><span>中文资料</span>
          </button>
          <button class="nav-item" type="button" data-route="workbook/stage-1">
            <span class="nav-icon">▤</span><span>第一阶段学习单</span>
          </button>
          <button class="nav-item" type="button" data-route="practice">
            <span class="nav-icon">✓</span><span>习题测验</span>
          </button>
          <button class="nav-item" type="button" data-route="projects">
            <span class="nav-icon">◇</span><span>项目实战</span>
          </button>
          <button class="nav-item" type="button" data-route="writing">
            <span class="nav-icon">✎</span><span>知乎专栏</span>
          </button>
          <button class="nav-item" type="button" data-route="progress">
            <span class="nav-icon">▦</span><span>学习记录</span>
          </button>
        </nav>

        <div class="stage-nav-wrap">
          <div class="nav-section-label">学习阶段</div>
          <nav class="stage-nav" id="stage-nav" aria-label="阶段导航"></nav>
        </div>

        <div class="sidebar-footer">
          <div class="sidebar-progress-head">
            <span>总进度</span><strong id="sidebar-progress-text">0%</strong>
          </div>
          <div class="progress-track small"><span id="sidebar-progress-bar"></span></div>
          <p>数据保存在当前浏览器</p>
        </div>
      </aside>

      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <main class="main-content">
        <header class="topbar">
          <button class="icon-button menu-button" id="menu-button" type="button" aria-label="打开菜单">☰</button>
          <div class="breadcrumbs" id="breadcrumbs">学习总览</div>
          <div class="topbar-actions">
            <div class="streak-pill" title="连续学习天数"><span>◆</span><strong id="top-streak">0</strong> 天连续</div>
            <button class="button button-primary compact" id="open-checkin" type="button">今日打卡</button>
          </div>
        </header>

        <div class="view" id="view" aria-live="polite"></div>
      </main>
    </div>

    <div class="modal-backdrop" id="checkin-modal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="checkin-title">
        <button class="modal-close" type="button" id="close-checkin" aria-label="关闭">×</button>
        <div class="eyebrow">DAILY CHECK-IN</div>
        <h2 id="checkin-title">记录今天的学习</h2>
        <p class="modal-intro">真正的连续不是每天看很多，而是每天留下一个可验证的产出。</p>
        <form id="checkin-form">
          <label class="field">
            <span>学习时长</span>
            <div class="input-with-suffix">
              <input id="checkin-hours" type="number" min="0.1" max="24" step="0.1" value="1" required />
              <span>小时</span>
            </div>
          </label>
          <label class="field">
            <span>今天完成了什么</span>
            <textarea id="checkin-note" rows="4" maxlength="300" placeholder="例如：完成 20 次采样稳定性实验，发现低 Temperature 仍有字段波动。" required></textarea>
          </label>
          <button class="button button-primary full" type="submit">保存打卡</button>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <input type="file" id="import-file" accept="application/json" hidden />

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
